# =============================================================================
# G1 Right Arm + Dexterous Hand — Plan C (Arm-Hand Fully Decoupled)
# =============================================================================
# Arm (reach_node):   4-DOF IK (damped pseudoinverse) → wrist position
# Hand (hand_controller): 23-DOF (wrist PID + finger impedance) → orientation + grasp
#
# Arm:  Δq = α·J⁺·e_pos + (I−J⁺J)·k_posture·(q_pref−q)
# Hand: τ = Kp_finger·(q_des−q_act) + Kd_finger·(0−dq_act) → q_cmd = q_des + τ/Kp_inner
# =============================================================================

reach_node:
  ros__parameters:

    # -------------------------------------------------------------------------
    # Robot Model — joint grouping (Plan C: wrist → Hand module)
    # -------------------------------------------------------------------------
    robot_model:
      urdf_path: ""  # Set via launch argument

      active_joints:                        # All right arm joints (for bridge Jacobian)
        - "right_shoulder_pitch_joint"
        - "right_shoulder_roll_joint"
        - "right_shoulder_yaw_joint"
        - "right_elbow_joint"
        - "right_wrist_roll_joint"
        - "right_wrist_pitch_joint"
        - "right_wrist_yaw_joint"

      arm_joints:                           # Arm IK subset — 4-DOF position control
        - "right_shoulder_pitch_joint"
        - "right_shoulder_roll_joint"
        - "right_shoulder_yaw_joint"
        - "right_elbow_joint"

      wrist_joints:                         # Wrist joints (Plan C: control in hand_controller, listed for bridge Jacobian)
        - "right_wrist_roll_joint"
        - "right_wrist_pitch_joint"
        - "right_wrist_yaw_joint"

      ee_link: "right_wrist_roll_link"      # Position control target (wrist origin)

    # -------------------------------------------------------------------------
    # Arm IK — 4-DOF → 3-DOF position (damped pseudoinverse + null-space)
    # -------------------------------------------------------------------------
    pid:
      kp: 2.0                    # Proportional gain
      ki: 0.4                    # Integral gain (anti-windup limit 0.10)
      kd: 0.05                   # Derivative gain
      damping: 2.0e-4            # Damped pseudoinverse λ (adaptive)
      tolerance: 0.02            # Position tolerance (2 cm)
      posture_gain: 0.2          # Null-space attraction toward posture_target
      posture_target: [-0.3, 0.0, 0.0, 0.3]  # arm(4): slight forward lean + elbow bend

      # -----------------------------------------------------------------------
      # Torque mode — DISABLED
      # -----------------------------------------------------------------------
      torque_mode: false
      gravity_compensation: false
      inner_servo_kp: 300.0
      inner_servo_kv: 5.0

    # -------------------------------------------------------------------------
    # Node configuration
    # -------------------------------------------------------------------------
    manager:
      control_rate: 50.0         # Control loop frequency (Hz)

    reach_node:
      origin_frame: "right_shoulder"
      pelvis_offset: [0.0, 0.0, 0.823]     # URDF pelvis → MuJoCo world Z alignment
      target_point_topic: "/target_point"   # Point, 3-DOF (shoulder-relative XYZ)
      joint_state_topic: "/joint_states"
      default_target: [0.18, -0.05, -0.10]  # Shoulder-relative, ~21 cm reachable

# =============================================================================
# Dexterous Hand — Wuji Hand 2 (Plan C: wrist×3 + fingers×20 = 23-DOF)
# =============================================================================
hand_controller:
  ros__parameters:

    # -------------------------------------------------------------------------
    # Joint names — wrist (3) + fingers (5 × 4 = 20) = 23 DOF
    # -------------------------------------------------------------------------
    wrist_joint_names:
      - "right_wrist_roll_joint"
      - "right_wrist_pitch_joint"
      - "right_wrist_yaw_joint"

    finger_joint_names:
      - "right_finger1_joint1"     # Thumb: base (CMC)
      - "right_finger1_joint2"     # Thumb: abduction
      - "right_finger1_joint3"     # Thumb: proximal (MCP)
      - "right_finger1_joint4"     # Thumb: distal (IP)
      - "right_finger2_joint1"     # Index: base
      - "right_finger2_joint2"     # Index: abduction (splay)
      - "right_finger2_joint3"     # Index: proximal (PIP)
      - "right_finger2_joint4"     # Index: distal (DIP)
      - "right_finger3_joint1"     # Middle: base
      - "right_finger3_joint2"     # Middle: abduction (splay)
      - "right_finger3_joint3"     # Middle: proximal (PIP)
      - "right_finger3_joint4"     # Middle: distal (DIP)
      - "right_finger4_joint1"     # Ring: base
      - "right_finger4_joint2"     # Ring: abduction (splay)
      - "right_finger4_joint3"     # Ring: proximal (PIP)
      - "right_finger4_joint4"     # Ring: distal (DIP)
      - "right_finger5_joint1"     # Pinky: base
      - "right_finger5_joint2"     # Pinky: abduction (splay)
      - "right_finger5_joint3"     # Pinky: proximal (PIP)
      - "right_finger5_joint4"     # Pinky: distal (DIP)

    # -------------------------------------------------------------------------
    # Wrist orientation PID
    # -------------------------------------------------------------------------
    # Jacobian provided by /mujoco_wrist_jacobian (MuJoCo numerical, avoids FK mismatch).
    kp_wrist: 2.0                # Orientation P gain
    ki_wrist: 0.05               # Orientation I gain (minimal — deadband handles static error)
    kd_wrist: 0.12               # Orientation D gain (damping to suppress jitter)
    wrist_vel_limit: 3.0         # Max wrist joint velocity (rad/s)
    wrist_delta_limit: 0.12      # Max per-cycle wrist joint delta (rad)
    wrist_offset_limit: 2.0      # ±max wrist offset from ready pose (rad)

    # -------------------------------------------------------------------------
    # Finger impedance control
    # -------------------------------------------------------------------------
    # τ = Kp_finger·(q_des−q_act) + Kd_finger·(0−dq_act)
    # Encoded as: q_cmd = q_des + τ / inner_servo_kp (position-encoded torque)
    kp_finger: 200.0              # Finger stiffness (N·m/rad)
    kd_finger: 0.3               # Finger damping (N·m·s/rad)
    tau_max_finger: 50.0         # Max finger torque (N·m)
    finger_delta_limit: 0.60     # Max per-cycle finger joint delta (rad)

    # Inner-loop gain — MUST match actual MuJoCo position-servo kp in scene XML.
    # Kp_inner = original_kp × finger_kp_scale = 5 × 60 = 300
    inner_servo_kp: 300.0

    # -------------------------------------------------------------------------
    # Grasp timing
    # -------------------------------------------------------------------------
    interp_duration: 0.05         # Default grasp action interpolation time (s)

    # -------------------------------------------------------------------------
    # Topics
    # -------------------------------------------------------------------------
    hand_command_topic: "/hand_command"
    joint_state_topic: "/joint_states"
    hand_orientation_topic: "/actual_hand_orientation"
    wrist_jacobian_topic: "/mujoco_wrist_jacobian"

# =============================================================================
# MuJoCo bridge — physics simulation (200 Hz)
# =============================================================================
mujoco_bridge:
  ros__parameters:
    scene_path: ""
    physics_rate: 200.0
    camera_rate: 15.0
    publish_camera: false
    publish_ft: true
    viewer: false
    base_frame: "pelvis"

    # Active joints: arm 4 + wrist 3 (Jacobian extraction only).
    # Arm 4 commanded from reach_node, wrist 3 + fingers 20 from hand_controller.
    active_joints:
      - "right_shoulder_pitch_joint"
      - "right_shoulder_roll_joint"
      - "right_shoulder_yaw_joint"
      - "right_elbow_joint"
      - "right_wrist_roll_joint"
      - "right_wrist_pitch_joint"
      - "right_wrist_yaw_joint"

    # Finger position-servo gain scaling (MJCF defaults ~0.2-0.7 kp → too slow).
    # biasprm[1] (~kp feedback) is also scaled: force = scale×kp×(ctrl−q) − scale×kv×qvel.
    finger_kp_scale: 60.0      # kp = 5×60 = 300
    finger_kv_scale: 1.0       # kv = 0.5 (no boost needed)
    finger_ema_alpha: 1.0     # EMA smoothing (1.0 = no smoothing)
    wrist_ema_alpha: 0.40      # Wrist EMA (↑reduces phase lag)

    # Hard clamping
    hard_clamp_pelvis: true
    hard_clamp_joints: true
    clamp_arm_joints: false
